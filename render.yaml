services:
  # =========================
  # Backend (FastAPI)
  # =========================
  - type: web
    name: ecommerce-backend
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: ALLOWED_ORIGINS
        value: "*"

      # Add these in Render Environment Variables
      # Do NOT hardcode secrets here.
      # - key: DATABASE_URL
      #   sync: false
      #
      # - key: SECRET_KEY
      #   sync: false

  # =========================
  # Frontend (React + Vite)
  # =========================
  - type: web
    name: ecommerce-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        value: https://ecommerce-backend.onrender.com
